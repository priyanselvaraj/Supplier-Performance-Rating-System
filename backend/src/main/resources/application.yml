server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: spr-system-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:spr_system_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: SPRS-HikariCP-Pool
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Application Custom Security & JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:80,http://localhost}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:noreply@sprsystem.com}
    from-name: ${MAIL_FROM_NAME:SPRS Notification Center}
    simulation-mode: ${MAIL_SIMULATION_MODE:false}
  sms:
    enabled: ${SMS_ENABLED:true}
    from: ${SMS_FROM:SPRS_ALERTS}
    simulation-mode: ${SMS_SIMULATION_MODE:true}
  ai:
    minimum-history: ${AI_MINIMUM_HISTORY:3}
    high-risk-threshold: ${AI_HIGH_RISK_THRESHOLD:50.0}
    critical-risk-threshold: ${AI_CRITICAL_RISK_THRESHOLD:75.0}
    decline-threshold: ${AI_DECLINE_THRESHOLD:5.0}
    low-score-threshold: ${AI_LOW_SCORE_THRESHOLD:70.0}

# Swagger OpenAPI UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# Actuator Health & Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false
  info:
    env:
      enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.supplier.sprsystem: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate: WARN
