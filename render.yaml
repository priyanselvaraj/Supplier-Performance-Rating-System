services:
  # 1. Spring Boot Backend Web Service (Docker)
  - type: web
    name: sprs-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080

      # --- Aiven MySQL Connection ---
      - key: DB_HOST
        sync: false          # Set manually in Render dashboard after Aiven is ready
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        value: supplier_rating_db
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_USE_SSL
        value: "true"        # Aiven requires SSL
      - key: DB_ALLOW_PUBLIC_KEY_RETRIEVAL
        value: "true"
      - key: HIBERNATE_DDL_AUTO
        value: update        # Auto-creates tables on first boot

      # --- Security ---
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: JWT_EXPIRATION_MS
        value: "86400000"    # 24 hours

      # --- CORS (update with your Vercel URL after frontend deploy) ---
      - key: ALLOWED_ORIGINS
        value: "https://sprs-frontend.vercel.app,http://localhost:5173"

      # --- Seed data on first boot ---
      - key: APP_SEED_ENABLED
        value: "true"

      # --- Mail (disabled by default; enable with Gmail SMTP if needed) ---
      - key: MAIL_ENABLED
        value: "false"
      - key: MAIL_SIMULATION_MODE
        value: "true"
